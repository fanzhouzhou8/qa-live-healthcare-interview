services:
  mysql:
    # 使用国内镜像加速拉取（等价于官方 mysql:8.0）
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: qa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: qa_healthcare
      MYSQL_USER: qa
      MYSQL_PASSWORD: qa123
      TZ: Asia/Shanghai
    # 不映射到宿主机端口，避免与本机 MySQL 冲突；phpMyAdmin 通过容器网络访问
    # 如需本机直连容器库，可改为 "13306:3306"
    # ports:
    #   - "13306:3306"
    volumes:
      - qa-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    # 使用国内镜像加速拉取（等价于官方 phpmyadmin:5）
    image: docker.m.daocloud.io/library/phpmyadmin:5
    container_name: qa-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: 123456
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"

volumes:
  qa-mysql-data:
